name: Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach APK to (e.g. v0.3.0)'
        required: false
        default: ''
  pull_request:
    paths:
      - '.github/workflows/android.yml'
      - 'apps/android/**'
      - 'apps/windows/src/renderer/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync application version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="$(echo "$GITHUB_REF_NAME" | sed 's/^v//')"
          npm --prefix apps/windows pkg set version="$VER"
          npm --prefix apps/android pkg set version="$VER"

      - name: Build shared packages
        run: pnpm --filter "./packages/**" build

      - name: Build Android web bundle
        run: pnpm --filter @slave-vpn/windows build

      - name: Sync committed Capacitor project
        working-directory: apps/android
        run: pnpm exec cap sync android

      - name: Android lint
        working-directory: apps/android/android
        run: |
          chmod +x gradlew
          ./gradlew lintDebug --no-daemon

      - name: Configure release signing
        id: signing
        working-directory: apps/android/android/app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REPOSITORY" = "dmtrbtc/SlaveAppsVPN" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::Release signing secret ANDROID_KEYSTORE_BASE64 is missing"
            exit 1
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: apps/android/android
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/android/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            ./gradlew assembleRelease --no-daemon -PslaveVersionCode="$GITHUB_RUN_NUMBER"
          else
            unset ANDROID_KEYSTORE_PATH
            ./gradlew assembleDebug --no-daemon -PslaveVersionCode="$GITHUB_RUN_NUMBER"
          fi

      - name: Verify APK structure and signature
        working-directory: apps/android/android
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            APK=app/build/outputs/apk/release/app-release.apk
          else
            APK=app/build/outputs/apk/debug/app-debug.apk
          fi
          test -f "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libgojni.so'
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/libgojni.so'
          unzip -l "$APK" | grep -q 'assets/public/index.html'
          # The pinned Mihomo/x-mobile graph uses a go.Seq ABI that requires the
          # host loader. Without it the APK builds but crashes on the first JNI call.
          unzip -p "$APK" 'classes*.dex' | strings | grep -q 'Lgo/LoadJNI;'
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK" | grep "package: name='com.slavevpn.app'"

      - name: Verify release signing certificate
        if: steps.signing.outputs.signed == 'true'
        working-directory: apps/android/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          GOT=$("$BT/apksigner" verify --print-certs "$APK" | grep -ioE 'SHA-256 digest: [0-9a-f]+' | head -1 | awk '{print $NF}')
          EXP=$(keytool -list -keystore app/release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" -v | grep -i 'SHA256:' | head -1 | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          # Public certificate digest of the key used by already-published APKs.
          # Pin it so replacing Actions Secrets with a different valid keystore
          # cannot silently produce an update Android refuses to install.
          PRODUCTION_CERT_SHA256=89a4c4d9bf92de10df8bec6f0d8d63067e26ebfc36156233d45b07b0735fb6ee
          test -n "$GOT"
          test "$GOT" = "$EXP"
          test "$GOT" = "$PRODUCTION_CERT_SHA256"

      - name: Collect APK
        if: github.event_name != 'pull_request'
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          mkdir -p artifacts
          if [ "$SIGNED" = "true" ]; then
            cp apps/android/android/app/build/outputs/apk/release/app-release.apk artifacts/SlaveAppsVPN-Android.apk
          else
            cp apps/android/android/app/build/outputs/apk/debug/app-debug.apk artifacts/SlaveAppsVPN-Android.apk
          fi

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: SlaveAppsVPN-Android
          path: artifacts/SlaveAppsVPN-Android.apk
          if-no-files-found: error

      - name: Attach APK to tag release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/SlaveAppsVPN-Android.apk

      - name: Attach APK to existing release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" artifacts/SlaveAppsVPN-Android.apk --clobber
