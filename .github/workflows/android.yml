name: Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach APK to (e.g. v0.3.0)'
        required: false
        default: ''
      attach_existing:
        description: 'Attach verified existing CI artifacts without rebuilding'
        required: false
        default: 'false'
      android_run_id:
        required: false
        default: ''
      windows_run_id:
        required: false
        default: ''
      android_sha256:
        required: false
        default: ''
  pull_request:
    paths:
      - '.github/workflows/android.yml'
      - 'apps/android/**'
      - 'apps/windows/src/renderer/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
jobs:
  build-android:
    if: github.event.inputs.attach_existing != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # A manually attached release APK must be built from that immutable
          # tag, never from whichever branch happened to be selected in the UI.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync application version from release tag
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        env:
          REQUESTED_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $TAG"
            exit 1
          fi
          VER="${TAG#v}"
          npm --prefix apps/windows pkg set version="$VER"
          npm --prefix apps/android pkg set version="$VER"

      - name: Build shared packages
        # Fail before packaging if a rebuild replaced the field-tested AAR.
        # The ordinary APK build consumes this file without rebuilding Go.
        run: |
          node scripts/validate-android-core.mjs
          pnpm --filter "./packages/**" build

      - name: Build Android web bundle
        run: pnpm --filter @slave-vpn/windows build

      - name: Sync committed Capacitor project
        working-directory: apps/android
        run: pnpm exec cap sync android

      - name: Android lint
        working-directory: apps/android/android
        run: |
          chmod +x gradlew
          ./gradlew lintDebug testDebugUnitTest --no-daemon

      - name: Configure release signing
        id: signing
        working-directory: apps/android/android/app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          REQUESTED_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REPOSITORY" = "dmtrbtc/SlaveAppsVPN" ] && { [[ "$GITHUB_REF" == refs/tags/* ]] || [ -n "$REQUESTED_TAG" ]; }; then
            echo "::error::Release signing secret ANDROID_KEYSTORE_BASE64 is missing"
            exit 1
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: apps/android/android
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/android/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            ./gradlew assembleRelease --no-daemon -PslaveVersionCode="$GITHUB_RUN_NUMBER"
          else
            unset ANDROID_KEYSTORE_PATH
            ./gradlew assembleDebug --no-daemon -PslaveVersionCode="$GITHUB_RUN_NUMBER"
          fi

      - name: Verify APK structure and signature
        working-directory: apps/android/android
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            APK=app/build/outputs/apk/release/app-release.apk
          else
            APK=app/build/outputs/apk/debug/app-debug.apk
          fi
          test -f "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libgojni.so'
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/libgojni.so'
          unzip -l "$APK" | grep -q 'assets/public/index.html'
          # The pinned Mihomo/x-mobile graph uses a go.Seq ABI that requires the
          # host loader. Without it the APK builds but crashes on the first JNI call.
          unzip -p "$APK" 'classes*.dex' | strings | grep -q 'Lgo/LoadJNI;'
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK" | grep "package: name='com.slavevpn.app'"

      - name: Verify release signing certificate
        if: steps.signing.outputs.signed == 'true'
        working-directory: apps/android/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          GOT=$("$BT/apksigner" verify --print-certs "$APK" | grep -ioE 'SHA-256 digest: [0-9a-f]+' | head -1 | awk '{print $NF}')
          EXP=$(keytool -list -keystore app/release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" -v | grep -i 'SHA256:' | head -1 | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          # Public certificate digest of the key used by already-published APKs.
          # Pin it so replacing Actions Secrets with a different valid keystore
          # cannot silently produce an update Android refuses to install.
          PRODUCTION_CERT_SHA256=89a4c4d9bf92de10df8bec6f0d8d63067e26ebfc36156233d45b07b0735fb6ee
          test -n "$GOT"
          test "$GOT" = "$EXP"
          test "$GOT" = "$PRODUCTION_CERT_SHA256"

      - name: Collect APK
        if: github.event_name != 'pull_request'
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          mkdir -p artifacts
          if [ "$SIGNED" = "true" ]; then
            cp apps/android/android/app/build/outputs/apk/release/app-release.apk artifacts/SlaveAppsVPN-Android.apk
          else
            cp apps/android/android/app/build/outputs/apk/debug/app-debug.apk artifacts/SlaveAppsVPN-Android.apk
          fi

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: SlaveAppsVPN-Android
          path: artifacts/SlaveAppsVPN-Android.apk
          if-no-files-found: error

      - name: Attach APK to tag release
        if: startsWith(github.ref, 'refs/tags/') && github.event.inputs.release_tag == ''
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/SlaveAppsVPN-Android.apk

      - name: Attach APK to existing release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" artifacts/SlaveAppsVPN-Android.apk --clobber

  attach-existing:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.attach_existing == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.release_tag }}
      ANDROID_RUN: ${{ github.event.inputs.android_run_id }}
      WINDOWS_RUN: ${{ github.event.inputs.windows_run_id }}
      ANDROID_SHA256: ${{ github.event.inputs.android_sha256 }}
    steps:
      - name: Verify immutable source and draft
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]]
          [[ "$ANDROID_RUN" =~ ^[0-9]+$ && "$WINDOWS_RUN" =~ ^[0-9]+$ ]]
          [[ "$ANDROID_SHA256" =~ ^[a-f0-9]{64}$ ]]
          read -r target kind < <(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '[.object.sha,.object.type]|@tsv')
          if [ "$kind" = tag ]; then
            target=$(gh api "repos/$GH_REPO/git/tags/$target" --jq .object.sha)
          fi
          for id in "$ANDROID_RUN" "$WINDOWS_RUN"; do
            read -r result sha < <(gh run view "$id" --json conclusion,headSha --jq '[.conclusion,.headSha]|@tsv')
            test "$result" = success
            test "$sha" = "$target"
          done
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true

      - name: Download verified build artifacts
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$ANDROID_RUN" -n SlaveAppsVPN-Android -D staging/android
          gh run download "$WINDOWS_RUN" -n SlaveAppsVPN-Windows -D staging/windows

      - name: Verify files and collect public assets
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, re, shutil
          version = os.environ['RELEASE_TAG'][1:]
          android = pathlib.Path('staging/android/SlaveAppsVPN-Android.apk')
          windows = pathlib.Path('staging/windows')
          public = pathlib.Path('public')
          public.mkdir()
          def digest(path, algorithm='sha256'):
              with path.open('rb') as source:
                  return hashlib.file_digest(source, algorithm).digest()
          assert digest(android).hex() == os.environ['ANDROID_SHA256']
          setup = f'SlaveAppsVPN-Setup-v{version}.exe'
          allowed = {setup, setup+'.blockmap', f'SlaveAppsVPN-Portable-v{version}.exe', 'latest.yml', 'SHA256SUMS.txt'}
          assert {p.name for p in windows.iterdir()} == allowed
          declared = set()
          for line in (windows/'SHA256SUMS.txt').read_text(encoding='utf-8-sig').splitlines():
              value, name = line.split('  ', 1)
              assert name in allowed and name != 'SHA256SUMS.txt'
              assert digest(windows/name).hex() == value
              declared.add(name)
          assert declared == allowed - {'SHA256SUMS.txt'}
          metadata = (windows/'latest.yml').read_text(encoding='utf-8-sig')
          assert re.search(r'^version:\s*'+re.escape(version)+r'\s*$', metadata, re.M)
          values = re.findall(r'^\s*sha512:\s*(.+)$', metadata, re.M)
          expected = base64.b64encode(digest(windows/setup, 'sha512')).decode()
          assert values and all(value.strip() == expected for value in values)
          shutil.copyfile(android, public/android.name)
          for name in allowed - {'SHA256SUMS.txt'}:
              shutil.copyfile(windows/name, public/name)
          lines = [digest(p).hex()+'  '+p.name for p in sorted(public.iterdir())]
          (public/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          PY

      - name: Attach public files to draft
        shell: bash
        run: gh release upload "$RELEASE_TAG" public/* --clobber
