name: Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach installers to (e.g. v0.2.0-rc1)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      # Bake the git TAG into the app version BEFORE the build, so __APP_VERSION__,
      # the installer name and electron-updater's latest.yml carry the FULL version
      # (incl. a -dev.N prerelease suffix). A bare "0.2.29" on a dev build reads as
      # NEWER than any "0.2.29-dev.N" → the in-app updater never offers dev builds.
      - name: Sync app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          npm --prefix apps/windows pkg set version="$VER"
          echo "app version → $VER"

      - name: Download engine binaries + geo databases
        run: pnpm download:binaries

      - name: Build shared packages first
        run: pnpm --filter "./packages/**" build

      - name: Validate generated Mihomo configurations
        run: node scripts/validate-mihomo-configs.mjs

      - name: Build installer
        working-directory: apps/windows
        run: pnpm dist
        env:
          # Code signing — only when secrets are configured.
          # See docs/CODESIGNING.md for setup.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Collect artifacts
        run: |
          mkdir artifacts
          Copy-Item apps/windows/release/*/SlaveAppsVPN-Setup-*.exe artifacts/
          Copy-Item apps/windows/release/*/SlaveAppsVPN-Portable-*.exe artifacts/
          # electron-updater metadata (generated even with --publish never).
          Copy-Item apps/windows/release/*/latest.yml artifacts/ -ErrorAction SilentlyContinue
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: SlaveAppsVPN-Windows
          path: artifacts/*
          if-no-files-found: error

      - name: Attach to release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*

      - name: Attach to existing release (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.inputs.release_tag }}" artifacts/* --clobber
        shell: bash
