name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  draft-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Validate release source and prepared notes
        run: node scripts/validate-release-readiness.mjs "${GITHUB_REF_NAME#v}"

      - name: Create draft release
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const tag = '${{ steps.version.outputs.VERSION }}'
            const isPrerelease = tag.includes('-alpha') || tag.includes('-beta') || tag.includes('-rc') || tag.includes('-dev')
            const notesPath = `docs/releases/${tag}.md`
            const hasPreparedNotes = fs.existsSync(notesPath)
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              draft: true,
              prerelease: isPrerelease,
              body: hasPreparedNotes ? fs.readFileSync(notesPath, 'utf8') : undefined,
              generate_release_notes: !hasPreparedNotes,
            })
