name: Предложение
description: Предложить улучшение Slave VPN
title: "[Предложение] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Опишите задачу пользователя. Не добавляйте реальные ключи, подписки и персональные данные.
  - type: dropdown
    id: platform
    attributes:
      label: Платформа
      options: [Windows, Android, Обе платформы, Документация]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу нужно решить?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое поведение
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы и ограничения
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка перед отправкой
      options:
        - label: В тексте и вложениях нет секретов и персональных данных.
          required: true
